name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          # RmU5f4Vq/UniXNU: upstream a3663791 plus one commit (76e93f4a7e99) that
          # adds "new file mode 100644" to
          # patches/mesa/turnip-frame-diagnostics.patch. Without it git apply
          # treats /dev/null as a literal path and the runtime step dies with
          # "error: dev/null: No such file or directory". Pinned by commit so a
          # later fork sync cannot silently drop the fix.
          repository: RmU5f4Vq/UniXNU
          ref: 76e93f4a7e99f1fc368192466c0544d154e1ea2a
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          # GitHub release downloads return 504 often enough that one failed
          # bottle aborted the whole job after the other eight had installed.
          # Bulk install first; on failure retry each missing formula alone.
          formulae="dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup"
          if ! brew install $formulae; then
            echo "bulk install failed; retrying formulae one at a time" >&2
            for f in $formulae; do
              brew list --formula "$f" >/dev/null 2>&1 && continue
              ok=0
              for attempt in 1 2 3; do
                brew install "$f" && { ok=1; break; }
                echo "retry $attempt for $f" >&2
                sleep $((attempt * 15))
              done
              [ "$ok" = 1 ] || { echo "::error::cannot install $f after 3 attempts"; exit 1; }
            done
          fi
          # blacktop/tap/ipsw ships a large release asset that timed out at the
          # gateway. Retry it on its own with backoff.
          tap=0
          for attempt in 1 2 3 4 5; do
            if brew install blacktop/tap/ipsw; then tap=1; break; fi
            echo "ipsw install attempt $attempt failed; backing off" >&2
            sleep $((attempt * 20))
          done
          [ "$tap" = 1 ] || { echo "::error::cannot install blacktop/tap/ipsw after 5 attempts"; exit 1; }
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: proprietary files
        # build-gop-legacy-display-27.py needs .cache/firmware/nanosic/MCU_Upgrade.bin
        # for the keyboard controller's RAM image and stops with
        # "nanosic/MCU_Upgrade.bin: run scripts/extract-files.py --section Keyboard"
        # when it is absent. No preflight script fetches it, so the run does it
        # here from the mirror proprietary-files.txt names (@fetch). The
        # extractor checks every entry against its recorded SHA-256 and writes
        # only files that match.
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
      - name: patch ath12k sparse-checkout
        # tools/fetch-sources.py drives `git sparse-checkout add` with the path
        # list from tools/source-lock.json. That list mixes directories
        # ("drivers/net/wireless/ath/") with single files ("net/core/skbuff.c")
        # and every entry keeps a leading slash. Git >= 2.37 rejects both forms:
        #   fatal: specify directories rather than patterns (no leading slash)
        #   fatal: 'net/core/skbuff.c' is not a directory; ... rerun with --skip-checks
        # The script already computes a stripped copy (`paths`) for its own
        # required-file checks; the add call is the only place still using the
        # raw list. --skip-checks lets the single files through. Upstream
        # UniXNU/Ath12kWifi carries the same line, so this patches the checkout
        # instead of a fork, and stays idempotent if upstream fixes it first.
        run: |
          file=device/drivers/Ath12kWifi/tools/fetch-sources.py
          python3 - "$file" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          skip = '--skip-checks'
          if skip in text:
              print('already patched')
              raise SystemExit(0)
          # The two forms upstream may carry: the raw list, or the stripped copy.
          raw = 'sparse-checkout", "add", *source["paths"]'
          stripped = 'sparse-checkout", "add", *paths'
          fixed = 'sparse-checkout", "add", "' + skip + '", *paths'
          if text.count(raw) == 1:
              text = text.replace(raw, fixed)
          elif text.count(stripped) == 1:
              text = text.replace(stripped, fixed)
          else:
              raise SystemExit(f'{path}: expected one add call, found raw={text.count(raw)} stripped={text.count(stripped)}')
          path.write_text(text)
          print(f'patched {path}')
          PY
          grep -n 'sparse-checkout' "$file"
      - name: ath12k fetch diagnostics
        # build-ath12k-wifi.py:16 hides tools/fetch-sources.sh behind
        # stdout=subprocess.DEVNULL. When that script fails, its explanation
        # (which source, which ref, which hash) is invisible in the job log and
        # only a bare CalledProcessError shows up. Fetch the pinned sources
        # here first, with output visible and retries, so a failure names its
        # cause. The build later reuses deps/<name> because resolve() skips an
        # existing directory.
        run: |
          cd device/drivers/Ath12kWifi
          for attempt in 1 2 3; do
            if bash tools/fetch-sources.sh; then
              echo "ath12k sources ready on attempt $attempt"
              exit 0
            fi
            echo "::warning::fetch-sources.sh failed on attempt $attempt"
            sleep $((attempt * 20))
          done
          echo "::error::fetch-sources.sh failed three times; sources above name the reason"
          exit 1
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
