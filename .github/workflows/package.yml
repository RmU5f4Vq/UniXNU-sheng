name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          # RmU5f4Vq/UniXNU: upstream a3663791 plus one commit (76e93f4a7e99) that
          # adds "new file mode 100644" to
          # patches/mesa/turnip-frame-diagnostics.patch. Without it git apply
          # treats /dev/null as a literal path and the runtime step dies with
          # "error: dev/null: No such file or directory". Pinned by commit so a
          # later fork sync cannot silently drop the fix.
          repository: RmU5f4Vq/UniXNU
          ref: 76e93f4a7e99f1fc368192466c0544d154e1ea2a
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          # GitHub release downloads return 504 often enough that one failed
          # bottle aborted the whole job after the other eight had installed.
          # Bulk install first; on failure retry each missing formula alone.
          formulae="dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup"
          if ! brew install $formulae; then
            echo "bulk install failed; retrying formulae one at a time" >&2
            for f in $formulae; do
              brew list --formula "$f" >/dev/null 2>&1 && continue
              ok=0
              for attempt in 1 2 3; do
                brew install "$f" && { ok=1; break; }
                echo "retry $attempt for $f" >&2
                sleep $((attempt * 15))
              done
              [ "$ok" = 1 ] || { echo "::error::cannot install $f after 3 attempts"; exit 1; }
            done
          fi
          # blacktop/tap/ipsw ships a large release asset that timed out at the
          # gateway. Retry it on its own with backoff.
          tap=0
          for attempt in 1 2 3 4 5; do
            if brew install blacktop/tap/ipsw; then tap=1; break; fi
            echo "ipsw install attempt $attempt failed; backing off" >&2
            sleep $((attempt * 20))
          done
          [ "$tap" = 1 ] || { echo "::error::cannot install blacktop/tap/ipsw after 5 attempts"; exit 1; }
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: proprietary files
        # build-gop-legacy-display-27.py needs .cache/firmware/nanosic/MCU_Upgrade.bin
        # for the keyboard controller's RAM image and stops with
        # "nanosic/MCU_Upgrade.bin: run scripts/extract-files.py --section Keyboard"
        # when it is absent. No preflight script fetches it, so the run does it
        # here from the mirror proprietary-files.txt names (@fetch). The
        # extractor checks every entry against its recorded SHA-256 and writes
        # only files that match.
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
      - name: patch source storage symbols
        # archive-08 builds libShengSourceStorage.a from the device package. The engine checkout
        # this workflow pins stops its iPadOS 27 branch at BootWatchdogPolicy.c, so WifiFirmware.c
        # and BluetoothFirmware.c are never compiled and the board probes of
        # libNativeLegacyDisplay.late.a cannot resolve their entry points at the kernel link:
        #   "_sheng_bt_firmware_read", referenced from:
        #       firmware(...) in libNativeLegacyDisplay.late.a[23](BluetoothProbe.o)
        #   "_sheng_wifi_firmware_read", referenced from:
        #       pFwGet(...) in libNativeLegacyDisplay.late.a[22](WifiProbe.o)
        # Its weak-defaults generator reads one declaration per line, so a declaration that lists
        # several weak imports after one type is skipped whole and the kernel link reports every
        # name in it:
        #   "_native_data_io_reads", referenced from: _compose in ... (BootLog.o)
        # Upstream main carries the two sources; the multi-declarator split is in neither revision.
        # Both edits are idempotent, and ast.parse checks the result before it is written.
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('UniXNU/scripts/build-sheng-source-storage.py')
          text = path.read_text()
          if 'WifiFirmware.c' in text and 'split_declarators' in text:
              print('already patched')
              raise SystemExit(0)

          old_bsd = "    bsd_sources = {'BootWatchdogPolicy.c', 'BootDiagExport.c'}\n"
          new_bsd = ("    bsd_sources = {'BootWatchdogPolicy.c', 'BootDiagExport.c',"
                     " 'WifiFirmware.c', 'BluetoothFirmware.c'}\n")
          if old_bsd not in text:
              raise SystemExit(f'{path}: bsd_sources line changed upstream')
          text = text.replace(old_bsd, new_bsd, 1)

          old_append = "        sources.append(device_source('BootDiagExport.c'))\n"
          new_append = (old_append +
                        "        sources.append(device_source('WifiFirmware.c'))\n"
                        "        sources.append(device_source('BluetoothFirmware.c'))\n")
          if old_append not in text:
              raise SystemExit(f'{path}: BootDiagExport append changed upstream')
          text = text.replace(old_append, new_append, 1)

          old_weak = r'''    import re
              lines = []
              for line in source.read_text().splitlines():
                  line = line.strip()
                  if not (line.startswith('extern ') and line.endswith('__attribute__((weak_import));')):
                      continue
                  decl = line[len('extern '):-len('__attribute__((weak_import));')].replace('__attribute__((weak_import))', '').strip()
                  call = re.match(r'^(.*?[\s*])([A-Za-z_]\w*)\s*\((.*)\)$', decl)
                  if call and '(*' not in decl.split(call.group(2))[0]:
                      ret = call.group(1).strip()
                      body = ('' if ret == 'void' else ' return -1;' if ret == 'int' else
                              ' return "";' if ret.replace(' ', '') in ('constchar*', 'char*') else ' return 0;')
                      lines.append(f'__attribute__((weak, visibility("hidden"))) {decl} {{{body} }}')
                  else:
                      lines.append(f'__attribute__((weak, visibility("hidden"))) {decl};')
          '''
          new_weak = r'''    import re

              def split_declarators(text):
                  """Split a declaration at its top-level commas, ignoring parameter lists."""
                  parts, depth, current = [], 0, ''
                  for char in text:
                      if char in '([{':
                          depth += 1
                      elif char in ')]}':
                          depth -= 1
                      if char == ',' and not depth:
                          parts.append(current.strip())
                          current = ''
                      else:
                          current += char
                  parts.append(current.strip())
                  return [part for part in parts if part]

              # Comments and preprocessor lines are dropped first: they sit between declarations and
              # would hide the 'extern' that opens the next one, and they carry no semicolon.
              text = re.sub(r'/\*.*?\*/', ' ', source.read_text(), flags=re.S)
              statements, current = [], ''
              for line in text.splitlines():
                  line = re.sub(r'//.*$', ' ', line).strip()
                  if not line or line.startswith('#'):
                      continue
                  if not current:
                      if not line.startswith('extern '):
                          continue
                      current = line
                  else:
                      current += ' ' + line
                  if current.endswith(';'):
                      statements.append(current)
                      current = ''
              lines = []
              # One declaration may list several declarators after a single type, e.g.
              #   extern volatile uint64_t a __attribute__((weak_import)), b __attribute__((weak_import)),
              # A per-line reader skips that whole declaration and the kernel link then reports every
              # name in it, so each declaration is split at its top-level commas and every declarator
              # expanded.
              for statement in statements:
                  if '__attribute__((weak_import))' not in statement:
                      continue
                  decl = statement[len('extern '):].replace('__attribute__((weak_import))', '').strip().rstrip(';').strip()
                  parts = split_declarators(decl)
                  head = re.match(r'^(.*?[\s*])([A-Za-z_]\w*)(\s*\(.*\))?$', parts[0])
                  declarators = ([parts[0]] + [head.group(1) + part for part in parts[1:]]) if head else [decl]
                  for declarator in declarators:
                      call = re.match(r'^(.*?[\s*])([A-Za-z_]\w*)\s*\((.*)\)$', declarator)
                      if call and '(*' not in declarator.split(call.group(2))[0]:
                          ret = call.group(1).strip()
                          body = ('' if ret == 'void' else ' return -1;' if ret == 'int' else
                                  ' return "";' if ret.replace(' ', '') in ('constchar*', 'char*') else ' return 0;')
                          lines.append(f'__attribute__((weak, visibility("hidden"))) {declarator} {{{body} }}')
                      else:
                          lines.append(f'__attribute__((weak, visibility("hidden"))) {declarator};')
          '''

          if old_weak not in text:
              raise SystemExit(f'{path}: weak defaults block changed upstream')
          text = text.replace(old_weak, new_weak, 1)
          ast.parse(text)
          path.write_text(text)
          print('patched', path)
          PY
          grep -n "WifiFirmware.c\|split_declarators" UniXNU/scripts/build-sheng-source-storage.py
      - name: patch fileset reference retries
        # archive-20 builds the RELEASE comparison kernel that XnuPrelink matches the packed kernel
        # against. scripts/build-fileset-release-reference.py repairs the first link failure with a
        # hard-coded stub prefix list
        #   r'^\s+"(_(?:native_[a-z0-9_]+|boot_log_rounds|boot_cache_input_capture))"'
        # plus one forced-exports sweep, then links once more. The 27 board patches call a board entry
        # point the reference build never links (build-boot-progress supplies the launchd launch
        # policy), so the second link still stops on it:
        #   "_sheng_boot_watchdog_policy", referenced from:
        #       _load_init_program in kern_exec.o
        #       l_sheng_boot_watchdog_policy$auth_ptr$ia$20679 in kern_exec.o
        # A board entry point behind an extra configuration (CONFIG_XNU_SHENG_PMGR selects
        # sheng_pmgr_run in bsd_init) leaves that list the same way.
        # Stub every symbol the linker reports as undefined and retry until the report is empty, so a
        # later board patch cannot outgrow the list again. Idempotent; it stops on an unexpected
        # upstream rewrite instead of guessing.
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('UniXNU/scripts/build-fileset-release-reference.py')
          text = path.read_text()
          if 'for attempt in range(1, 6)' in text and 'stubbed = set()' in text:
              print('already patched')
              raise SystemExit(0)
          if 'stub_names = sorted(' not in text:
              raise SystemExit(f'{path}: neither the retry loop nor the stub list is present; upstream rewrote the block')
          start_marker = "    # The bring-up patch calls native hooks from the kernel core behind weak_import declarations; on arm64e\n"
          end_marker = "    if result.returncode:\n        raise SystemExit(result.returncode)\n"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0:
              raise SystemExit(f'{path}: stub block not found (start={start}, end={end})')
          # the raw string starts on this line so the block keeps its own indentation
          replacement = r'''    # The bring-up patch calls native hooks from the kernel core behind weak_import declarations; on arm64e
              # the authenticated pointer of an undefined weak symbol fails the link. The private copy stubs them: this
              # comparison kernel never runs, the prelink step reads its layout. Board patches add entry points of their
              # own (the watchdog launch policy, the PMGR bridge) that the archives of this profile provide, and the
              # reference build links none of those archives, so the stub set is every symbol the linker reports as
              # undefined - retried until the report is empty - instead of a prefix list that a new board patch outgrows.
              stubbed = set()
              cleaned = False
              result = None
              for attempt in range(1, 6):
                  build_log = (output / f'{mode}-build.log').read_text()
                  undefined = {name for name in re.findall(r'^\s+"(_[A-Za-z0-9_.]+)", referenced from:', build_log, re.M)
                               if name not in stubbed}
                  if undefined:
                      stubbed |= undefined
                      (output / 'native-stubs.c').write_text(''.join(f'long {name[1:]};\n' for name in sorted(stubbed)))   # the linker names carry the leading underscore
                      iphoneos = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip()
                      subprocess.run(['xcrun', 'clang', '-arch', 'arm64e', '-mkernel', '-isysroot', iphoneos, '-c',
                                      '-o', str(output / 'native-stubs.o'), str(output / 'native-stubs.c')], check=True)
                      at = next(i for i, a in enumerate(args) if a.startswith('LD_KERNEL_ARCHIVES='))
                      if 'native-stubs.o' not in args[at]:
                          args[at] += f' -Wl,-force_load,{output}/native-stubs.o'
                      print('reference link', attempt, 'stubbed', len(undefined), 'undefined symbols:',
                            ' '.join(sorted(undefined)), flush=True)
                  if not cleaned:
                      # Forced exports the built objects cannot provide: remove them from this private copy and link again
                      # (the symbols are absent from the comparison kernel either way; the first link can stop exactly there,
                      # and its file list is what names the objects that were built).
                      objects = linked_objects(output / f'{mode}-obj/RELEASE_ARM64_BCM2837', options.lto)
                      objects += list(map(str, archives + forced))
                      names = set()
                      for i in range(0, len(objects), 100):
                          listed = subprocess.run(['xcrun', 'nm', '-gUj', *objects[i:i + 100]], capture_output=True, text=True, check=True)
                          names.update(symbol for symbol in listed.stdout.splitlines() if symbol.startswith('_') and ' ' not in symbol)
                      removed = []
                      for filename in ('Private.exports', 'Private.arm64.exports'):
                          path = output / 'source/config' / filename
                          lines = path.read_text().splitlines(keepends=True)
                          rejected = {line.strip() for line in lines
                                      if line.strip().startswith('_') and ':' not in line and not any(fnmatch.fnmatchcase(n, line.strip()) for n in names)}
                          removed.extend(sorted(rejected))
                          path.write_text(''.join(line for line in lines if line.strip() not in rejected))
                      import json as _json
                      record = output / 'omitted-unavailable-forced-exports.json'
                      previous = _json.loads(record.read_text()) if record.exists() else []
                      record.write_text(_json.dumps(sorted(set(previous + removed)), indent=2) + chr(10))
                      print('removed', len(removed), 'unavailable forced exports; linking again', flush=True)
                      cleaned = True
                  elif not undefined:
                      break   # a further link would fail exactly as the last one did
                  with (output / f'{mode}-build.log').open('a') as log:
                      result = subprocess.run(args, cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT)
                  print('RELEASE reference exit', result.returncode, 'log', output / f'{mode}-build.log', flush=True)
                  if result.returncode == 0:
                      break
              if result is None or result.returncode:
                  raise SystemExit(result.returncode if result is not None else 1)
          '''
          patched = text[:start] + replacement + text[end + len(end_marker):]
          ast.parse(patched)
          path.write_text(patched)
          print('patched', path)
          PY
          grep -n 'for attempt in range' UniXNU/scripts/build-fileset-release-reference.py
      - name: patch ath12k sparse-checkout
        # tools/fetch-sources.py drives `git sparse-checkout add` with the path
        # list from tools/source-lock.json. That list mixes directories
        # ("drivers/net/wireless/ath/") with single files ("net/core/skbuff.c")
        # and every entry keeps a leading slash. Git >= 2.37 rejects both forms:
        #   fatal: specify directories rather than patterns (no leading slash)
        #   fatal: 'net/core/skbuff.c' is not a directory; ... rerun with --skip-checks
        # The script already computes a stripped copy (`paths`) for its own
        # required-file checks; the add call is the only place still using the
        # raw list. --skip-checks lets the single files through. Upstream
        # UniXNU/Ath12kWifi carries the same line, so this patches the checkout
        # instead of a fork, and stays idempotent if upstream fixes it first.
        run: |
          file=device/drivers/Ath12kWifi/tools/fetch-sources.py
          python3 - "$file" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          skip = '--skip-checks'
          if skip in text:
              print('already patched')
              raise SystemExit(0)
          # The two forms upstream may carry: the raw list, or the stripped copy.
          raw = 'sparse-checkout", "add", *source["paths"]'
          stripped = 'sparse-checkout", "add", *paths'
          fixed = 'sparse-checkout", "add", "' + skip + '", *paths'
          if text.count(raw) == 1:
              text = text.replace(raw, fixed)
          elif text.count(stripped) == 1:
              text = text.replace(stripped, fixed)
          else:
              raise SystemExit(f'{path}: expected one add call, found raw={text.count(raw)} stripped={text.count(stripped)}')
          path.write_text(text)
          print(f'patched {path}')
          PY
          grep -n 'sparse-checkout' "$file"
      - name: ath12k fetch diagnostics
        # build-ath12k-wifi.py:16 hides tools/fetch-sources.sh behind
        # stdout=subprocess.DEVNULL. When that script fails, its explanation
        # (which source, which ref, which hash) is invisible in the job log and
        # only a bare CalledProcessError shows up. Fetch the pinned sources
        # here first, with output visible and retries, so a failure names its
        # cause. The build later reuses deps/<name> because resolve() skips an
        # existing directory.
        run: |
          cd device/drivers/Ath12kWifi
          for attempt in 1 2 3; do
            if bash tools/fetch-sources.sh; then
              echo "ath12k sources ready on attempt $attempt"
              exit 0
            fi
            echo "::warning::fetch-sources.sh failed on attempt $attempt"
            sleep $((attempt * 20))
          done
          echo "::error::fetch-sources.sh failed three times; sources above name the reason"
          exit 1
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
